<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="A* route replanning around a hazard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b1a"/><stop offset="1" stop-color="#0a1830"/></linearGradient>
<pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12324f" stroke-width="0.8"/></pattern>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="10" fill="#ef4444" fill-opacity="0.35"/></pattern>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="pan"><rect x="30" y="60" width="610" height="290" rx="12"/></clipPath>
<path id="alt" d="M80,300 C170,345 340,340 410,265 S520,150 590,110" fill="none"/>
</defs>
<rect width="1200" height="380" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
<text x="30" y="38" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="4" fill="#22d3ee">HAZARD-AWARE 3D A* RE-PLANNING</text>
<rect x="30" y="60" width="610" height="290" rx="12" fill="#06172b" stroke="#22d3ee" stroke-opacity="0.4"/>
<g clip-path="url(#pan)">
  <rect x="30" y="60" width="610" height="290" fill="url(#g)"/>
  <circle cx="330" cy="205" r="52" fill="url(#hatch)" stroke="#ef4444" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="205" r="52" fill="none" stroke="#ef4444"><animate attributeName="r" values="52;90" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="330" y="150" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11" fill="#fecaca" letter-spacing="2">COLLAPSE / WATER SURGE</text>
  <path d="M80,300 L590,110" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 8" fill="none" stroke-opacity="0.85"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/></path>
  <g stroke="#ef4444" stroke-width="4" stroke-linecap="round"><line x1="318" y1="193" x2="342" y2="217"/><line x1="342" y1="193" x2="318" y2="217"/></g>
  <path d="M80,300 C170,345 340,340 410,265 S520,150 590,110" stroke="#34d399" stroke-width="3.5" fill="none" stroke-dasharray="12 8" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1.6s" repeatCount="indefinite"/></path>
  <circle cx="80" cy="300" r="15" fill="#0c4a6e" stroke="#22d3ee" stroke-width="2"/><text x="80" y="305" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-weight="700" font-size="14" fill="#e0faff">H</text>
  <circle cx="590" cy="110" r="6" fill="#ef4444" filter="url(#glow)"/><circle cx="590" cy="110" r="6" fill="none" stroke="#ef4444"><animate attributeName="r" values="6;28" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/></circle>
  <text x="590" y="92" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11" fill="#fecaca" letter-spacing="1">S-01 #1 SAVE FIRST</text>
  <g filter="url(#glow)"><g>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#e0faff" stroke-width="2"/><line x1="9" y1="-9" x2="-9" y2="9" stroke="#e0faff" stroke-width="2"/>
    <circle cx="-9" cy="-9" r="4" fill="none" stroke="#22d3ee"/><circle cx="9" cy="-9" r="4" fill="none" stroke="#22d3ee"/><circle cx="-9" cy="9" r="4" fill="none" stroke="#22d3ee"/><circle cx="9" cy="9" r="4" fill="none" stroke="#22d3ee"/>
    <circle r="3.5" fill="#22d3ee"/>
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#alt"/></animateMotion></g></g>
</g>
<g font-family="Consolas,Menlo,monospace">
  <text x="690" y="100" font-size="13" fill="#94a3b8" letter-spacing="2">RELATIVE ROUTE RISK</text>
  <text x="690" y="140" font-size="13" fill="#fecaca">PRIMARY (BLOCKED)</text>
  <rect x="690" y="150" width="440" height="26" rx="6" fill="#0e2a44"/>
  <rect x="690" y="150" width="440" height="26" rx="6" fill="#ef4444"><animate attributeName="width" values="0;440;440;0" keyTimes="0;0.2;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="1120" y="169" text-anchor="end" font-size="13" font-weight="700" fill="#fff">100%</text>
  <text x="690" y="220" font-size="13" fill="#a7f3d0">A* REPLANNED ROUTE</text>
  <rect x="690" y="230" width="440" height="26" rx="6" fill="#0e2a44"/>
  <rect x="690" y="230" width="141" height="26" rx="6" fill="#34d399"><animate attributeName="width" values="0;0;141;141;0" keyTimes="0;0.15;0.4;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="845" y="249" font-size="13" font-weight="700" fill="#34d399">32%</text>
  <rect x="690" y="285" width="200" height="46" rx="10" fill="#06251f" stroke="#34d399"/><text x="790" y="305" text-anchor="middle" font-size="22" font-weight="800" fill="#6ee7b7">−68% RISK</text><text x="790" y="323" text-anchor="middle" font-size="10.5" fill="#a7f3d0" letter-spacing="2">SAFER ROUTE</text>
  <rect x="910" y="285" width="200" height="46" rx="10" fill="#0a1a2e" stroke="#38bdf8"/><text x="1010" y="305" text-anchor="middle" font-size="22" font-weight="800" fill="#7dd3fc">+42 m</text><text x="1010" y="323" text-anchor="middle" font-size="10.5" fill="#bae6fd" letter-spacing="2">DETOUR COST</text>
</g>
</svg>