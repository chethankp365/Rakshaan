<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sensor fusion flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b1a"/><stop offset="1" stop-color="#0a1830"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
  <text x="30" y="38" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="4" fill="#22d3ee">MULTI-SENSOR FUSION → VERIFIED SURVIVOR</text>

  <!-- sensors -->
  <g font-family="Consolas,Menlo,monospace" font-size="14" text-anchor="middle">
    <rect x="50" y="65" width="200" height="56" rx="10" fill="#0a1a2e" stroke="#38bdf8"/><text x="150" y="98" fill="#e2f6ff">RGB 4K + YOLOv8</text>
    <rect x="50" y="122" width="200" height="56" rx="10" fill="#0a1a2e" stroke="#fb923c"/><text x="150" y="155" fill="#e2f6ff">FLIR THERMAL</text>
    <rect x="50" y="179" width="200" height="56" rx="10" fill="#0a1a2e" stroke="#a78bfa"/><text x="150" y="212" fill="#e2f6ff">SOLID LiDAR</text>
  </g>
  <!-- flows -->
  <g fill="none" stroke-width="2" stroke-dasharray="7 7">
    <path d="M250,93 C340,93 340,150 430,150" stroke="#38bdf8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M250,150 L430,150" stroke="#fb923c"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M250,207 C340,207 340,150 430,150" stroke="#a78bfa"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M610,150 L740,150" stroke="#22d3ee"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M940,150 L1000,150" stroke="#34d399"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/></path>
  </g>
  <!-- fusion engine -->
  <g filter="url(#glow)">
    <rect x="430" y="105" width="180" height="90" rx="14" fill="#0b2a44" stroke="#22d3ee" stroke-width="2"/>
    <rect x="430" y="105" width="180" height="90" rx="14" fill="none" stroke="#67e8f9" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></rect>
  </g>
  <text x="520" y="145" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#e0faff">FUSION</text>
  <text x="520" y="168" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#e0faff">ENGINE</text>

  <!-- confidence ring -->
  <g transform="translate(840,150)">
    <circle r="70" fill="none" stroke="#12324f" stroke-width="12"/>
    <circle r="70" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="440" stroke-dashoffset="440">
      <animate attributeName="stroke-dashoffset" values="440;6;6;440" keyTimes="0;0.4;0.9;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#e0faff">98.6%</text>
    <text y="30" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="11" fill="#67e8f9" letter-spacing="2">CONFIDENCE</text>
  </g>

  <!-- output -->
  <g font-family="Consolas,Menlo,monospace" text-anchor="middle">
    <rect x="1000" y="105" width="150" height="90" rx="12" fill="#06251f" stroke="#34d399" stroke-width="2"/>
    <text x="1075" y="140" font-size="14" font-weight="700" fill="#6ee7b7">VERIFIED</text>
    <text x="1075" y="162" font-size="12" fill="#a7f3d0">#1 SAVE FIRST</text>
    <text x="1075" y="180" font-size="11" fill="#6ee7b7">→ DISPATCH</text>
  </g>
  <text x="600" y="275" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" fill="#64748b" letter-spacing="1">Every rank comes with an evidence trace</text>
</svg>
